[package]
name = "speech-to-text"
version = "1.33.1"
description = "Dictation by hotkey, transcribed on your computer with whisper.cpp"
authors = ["Ciro Cesar Maciel"]
license = "MIT"
repository = "https://github.com/ciro-maciel/speech-to-text.git"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "speech_to_text_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "devtools", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
url = "2"
reqwest = { version = "0.12", features = ["stream", "json", "multipart"] }
futures = "0.3"
which = "6"
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
dotenvy = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sys-locale = "0.3"

# Used to read NSScreen.visibleFrame so the overlay anchors respect the
# macOS menu bar and Dock. Pulled in by Tauri transitively; we declare them
# explicitly so we can `use` them directly.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSGeometry", "NSString"] }
# Real Accessibility check (AXIsProcessTrusted) and posting ⌘V directly.
core-foundation = "0.10"
core-graphics = "0.25"
# The tray icon under Tauri's, to swap image and template flag in one step (tray.rs).
tray-icon = "0.21"

# SendInput for Ctrl+V on Windows (already in the tree through Tauri).
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_UI_Input_KeyboardAndMouse"] }
