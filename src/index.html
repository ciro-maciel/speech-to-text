<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline';"
    />
    <title>Speech to Text</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- ─────────────  FIRST RUN  ───────────── -->
    <section id="onboarding" class="onboarding" hidden>
      <div class="ob-inner">
        <p class="label"><span data-i18n="ob.firstRun">First launch</span> · <span id="ob-step-label">1 of 3</span></p>

        <div class="ob-step" data-step="1">
          <h1 class="ob-title" data-i18n="ob.1.title"></h1>
          <p class="sub" data-i18n="ob.1.sub"></p>
          <div class="rows" id="ob-perms"></div>
          <div class="ob-actions">
            <button class="btn" id="ob-grant" type="button" data-i18n="ob.grant"></button>
            <button class="btn-ghost" id="ob-next-1" type="button" data-i18n="ob.continue"></button>
          </div>
          <p class="note" data-i18n="perm.liveNote"></p>
        </div>

        <div class="ob-step" data-step="2" hidden>
          <h1 class="ob-title" data-i18n="ob.2.title"></h1>
          <p class="sub" data-i18n="ob.2.sub"></p>
          <div class="ob-test">
            <span class="meter" id="ob-meter" aria-hidden="true"></span>
            <button class="btn" id="ob-record" type="button" data-i18n="ob.record"></button>
          </div>
          <p class="ob-result" id="ob-result" aria-live="polite"></p>
          <div class="ob-actions">
            <button class="btn-ghost" id="ob-back-2" type="button" data-i18n="ob.back"></button>
            <button class="btn-ghost" id="ob-next-2" type="button" data-i18n="ob.continue"></button>
          </div>
        </div>

        <div class="ob-step" data-step="3" hidden>
          <h1 class="ob-title" data-i18n="ob.3.title"></h1>
          <p class="sub" id="ob-hotkey-sub"></p>
          <textarea id="ob-field" class="ob-field" rows="3" data-i18n-placeholder="ob.3.field"></textarea>
          <p class="ob-result" id="ob-hotkey-result" aria-live="polite"></p>
          <div class="ob-actions">
            <button class="btn-ghost" id="ob-back-3" type="button" data-i18n="ob.back"></button>
            <button class="btn" id="ob-finish" type="button" data-i18n="ob.finish"></button>
          </div>
        </div>
      </div>
    </section>

    <!-- ─────────────  SETTINGS  ───────────── -->
    <div class="app" id="app">
      <aside class="side">
        <div class="drag" data-tauri-drag-region></div>
        <p class="word" data-tauri-drag-region>Speech to Text</p>
        <nav class="groups" data-i18n-aria="nav.sections">
          <div class="group">
            <p class="label" data-i18n="nav.dictation"></p>
            <button type="button" data-pane="inicio" aria-pressed="true"><svg class="i"><use href="icons.svg#home"/></svg><span data-i18n="nav.home"></span></button>
            <button type="button" data-pane="ditado"><svg class="i"><use href="icons.svg#keyboard"/></svg><span data-i18n="nav.shortcut"></span></button>
            <button type="button" data-pane="transcricao"><svg class="i"><use href="icons.svg#cpu"/></svg><span data-i18n="nav.transcription"></span></button>
            <button type="button" data-pane="glossario"><svg class="i"><use href="icons.svg#vocabulary"/></svg><span data-i18n="nav.glossary"></span></button>
          </div>
          <div class="group">
            <p class="label" data-i18n="nav.after"></p>
            <button type="button" data-pane="ia"><svg class="i"><use href="icons.svg#sparkles"/></svg><span data-i18n="nav.ai"></span></button>
            <button type="button" data-pane="overlay"><svg class="i"><use href="icons.svg#layout-navbar"/></svg><span data-i18n="nav.overlay"></span></button>
          </div>
          <div class="group">
            <p class="label" data-i18n="nav.settings"></p>
            <button type="button" data-pane="permissoes"><svg class="i"><use href="icons.svg#lock"/></svg><span data-i18n="nav.permissions"></span><span class="count" id="perm-flag" hidden></span></button>
            <button type="button" data-pane="sistema"><svg class="i"><use href="icons.svg#settings"/></svg><span data-i18n="nav.system"></span></button>
          </div>
        </nav>
        <footer class="foot">
          <button type="button" class="status" id="status-line"><svg class="i"><use href="icons.svg#check"/></svg><span></span></button>
          <p class="ver" id="nav-foot"></p>
        </footer>
      </aside>

      <main class="main">
        <!-- INÍCIO -->
        <section class="pane" data-pane="inicio">
          <header class="ph">
            <div class="ph-text">
              <p class="label">Speech to Text</p>
              <h1 data-i18n="nav.home"></h1>
              <p class="sub" id="home-sub"></p>
            </div>
          </header>
          <div class="stats">
            <div><b id="stat-count">0</b><span data-i18n="home.dictationsToday"></span></div>
            <div><b id="stat-words">0</b><span data-i18n="home.wordsToday"></span></div>
            <div><b id="stat-latency">—</b><span data-i18n="home.latency"></span></div>
          </div>
          <div class="between">
            <p class="label" data-i18n="home.recent"></p>
            <span class="note" id="paste-last-hint"></span>
          </div>
          <div class="hist" id="history-list"></div>
          <p class="note" id="history-note"></p>
        </section>

        <!-- DITADO -->
        <section class="pane" data-pane="ditado" hidden>
          <header class="ph">
            <div class="ph-text">
              <p class="label">Speech to Text</p>
              <h1 data-i18n="nav.shortcut"></h1>
              <p class="sub" data-i18n="dict.sub"></p>
            </div>
          </header>
          <div class="rows">
            <div class="row">
              <span data-i18n="dict.hotkey"></span>
              <span class="ctl hotkey" id="hk-transcribe">
                <span class="keys" data-role="keys"></span>
                <span class="capture" data-role="capture" hidden data-i18n="hotkey.type"></span>
                <button class="lnk" type="button" data-role="edit" data-i18n="hotkey.edit"></button>
              </span>
            </div>
            <div class="row">
              <span><span data-i18n="dict.mode"></span><small data-i18n="dict.mode.hint"></small></span>
              <span class="seg" data-setting="triggerMode" role="group">
                <button type="button" data-value="hold" data-i18n="dict.mode.hold"></button>
                <button type="button" data-value="toggle" data-i18n="dict.mode.toggle"></button>
              </span>
            </div>
            <div class="row">
              <span><span data-i18n="dict.esc"></span><small data-i18n="dict.esc.hint"></small></span>
              <button class="sw" type="button" role="switch" data-setting="escCancels" data-i18n-aria="dict.esc"></button>
            </div>
            <div class="row">
              <span><span data-i18n="dict.mic"></span><small id="mic-hint" data-i18n="dict.mic.hint"></small></span>
              <span class="ctl">
                <span class="meter" id="mic-meter" aria-hidden="true"></span>
                <select id="mic-select" class="sel" data-i18n-aria="dict.mic"></select>
              </span>
            </div>
            <div class="row">
              <span data-i18n="dict.language"></span>
              <select class="sel" data-setting="language" data-i18n-aria="dict.language">
                <option value="pt" data-i18n="lang.pt"></option>
                <option value="en" data-i18n="lang.en"></option>
                <option value="es" data-i18n="lang.es"></option>
                <option value="fr" data-i18n="lang.fr"></option>
                <option value="de" data-i18n="lang.de"></option>
                <option value="it" data-i18n="lang.it"></option>
                <option value="auto" data-i18n="dict.language.auto"></option>
              </select>
            </div>
            <div class="row">
              <span data-i18n="dict.sounds"></span>
              <button class="sw" type="button" role="switch" data-setting="sounds" data-i18n-aria="dict.sounds"></button>
            </div>
            <div class="row" data-platform="macos">
              <span><span data-i18n="dict.mute"></span><small data-i18n="dict.mute.hint"></small></span>
              <button class="sw" type="button" role="switch" data-setting="muteWhileDictating" data-i18n-aria="dict.mute.aria"></button>
            </div>
          </div>
        </section>

        <!-- TRANSCRIÇÃO -->
        <section class="pane" data-pane="transcricao" hidden>
          <header class="ph">
            <div class="ph-text">
              <p class="label">Speech to Text</p>
              <h1 data-i18n="nav.transcription"></h1>
              <p class="sub" data-i18n="tx.sub"></p>
            </div>
          </header>
          <div class="models">
            <div class="mh"><span data-i18n="tx.model"></span><span data-i18n="tx.size"></span><span data-i18n="tx.timeHere"></span><span></span></div>
            <div id="model-list"></div>
          </div>
          <div class="progress" id="download-progress" hidden><span id="download-bar"></span></div>
          <p class="note" id="download-text"></p>
          <div class="rows">
            <div class="row">
              <span><span data-i18n="tx.vad"></span><small data-i18n="tx.vad.hint"></small></span>
              <button class="sw" type="button" role="switch" data-setting="voiceDetection" data-i18n-aria="tx.vad"></button>
            </div>
            <div class="row">
              <span><span data-i18n="tx.keepLoaded"></span><small data-i18n="tx.keepLoaded.hint"></small></span>
              <button class="sw" type="button" role="switch" data-setting="keepModelLoaded" data-i18n-aria="tx.keepLoaded"></button>
            </div>
          </div>
          <p class="note" data-i18n="tx.timeNote"></p>
        </section>

        <!-- GLOSSÁRIO -->
        <section class="pane" data-pane="glossario" hidden>
          <header class="ph">
            <div class="ph-text">
              <p class="label">Speech to Text</p>
              <h1 data-i18n="nav.glossary"></h1>
              <p class="sub" data-i18n="gl.sub"></p>
            </div>
          </header>
          <form class="add" id="term-form">
            <input class="inp" id="term-input" type="text" data-i18n-placeholder="gl.placeholder" autocomplete="off" spellcheck="false" />
            <button class="btn-sm" type="submit" data-i18n="gl.add"></button>
          </form>
          <div class="terms" id="term-list"></div>
          <p class="note" id="term-note"></p>
        </section>

        <!-- INTELIGÊNCIA -->
        <section class="pane" data-pane="ia" hidden>
          <header class="ph">
            <div class="ph-text">
              <p class="label">Speech to Text</p>
              <h1 data-i18n="nav.ai"></h1>
              <p class="sub" data-i18n="ai.sub"></p>
            </div>
          </header>
          <div class="rows">
            <div class="row">
              <span><span data-i18n="ai.refine"></span><small data-i18n="ai.refine.hint"></small></span>
              <button class="sw" type="button" role="switch" data-setting="refinementEnabled" data-i18n-aria="ai.refine"></button>
            </div>
            <div class="row">
              <span><span data-i18n="ai.level"></span><small data-i18n="ai.level.hint"></small></span>
              <span class="seg" data-setting="refinementLevel" role="group">
                <button type="button" data-value="light" data-i18n="ai.level.light"></button>
                <button type="button" data-value="rewrite" data-i18n="ai.level.rewrite"></button>
              </span>
            </div>
            <div class="row">
              <span data-i18n="ai.translate"></span>
              <button class="sw" type="button" role="switch" data-setting="translateEnabled" data-i18n-aria="ai.translate"></button>
            </div>
            <div class="row">
              <span data-i18n="ai.translateHotkey"></span>
              <span class="ctl hotkey" id="hk-translate">
                <span class="keys" data-role="keys"></span>
                <span class="capture" data-role="capture" hidden data-i18n="hotkey.type"></span>
                <button class="lnk" type="button" data-role="edit" data-i18n="hotkey.edit"></button>
              </span>
            </div>
            <div class="row">
              <span data-i18n="ai.target"></span>
              <select class="sel" data-setting="targetLanguage" data-i18n-aria="ai.target">
                <option value="en" data-i18n="lang.en"></option>
                <option value="pt" data-i18n="lang.pt"></option>
                <option value="es" data-i18n="lang.es"></option>
                <option value="fr" data-i18n="lang.fr"></option>
                <option value="de" data-i18n="lang.de"></option>
                <option value="it" data-i18n="lang.it"></option>
                <option value="ja" data-i18n="lang.ja"></option>
                <option value="ko" data-i18n="lang.ko"></option>
                <option value="zh" data-i18n="lang.zh"></option>
                <option value="ru" data-i18n="lang.ru"></option>
              </select>
            </div>
          </div>
          <p class="label block" data-i18n="ai.provider"></p>
          <div class="rows">
            <div class="row">
              <label for="or-model" data-i18n="ai.model"></label>
              <input class="inp inline" id="or-model" type="text" data-i18n-placeholder="ai.modelPlaceholder" autocomplete="off" spellcheck="false" />
            </div>
            <div class="row">
              <label for="or-key" data-i18n="ai.key"></label>
              <span class="ctl">
                <input class="inp inline" id="or-key" type="password" placeholder="sk-or-v1-…" autocomplete="off" spellcheck="false" />
                <button class="lnk" id="or-test" type="button" data-i18n="ai.test"></button>
              </span>
            </div>
          </div>
          <p class="note" id="or-status" data-i18n="ai.note"></p>
        </section>

        <!-- OVERLAY -->
        <section class="pane" data-pane="overlay" hidden>
          <header class="ph">
            <div class="ph-text">
              <p class="label">Speech to Text</p>
              <h1 data-i18n="nav.overlay"></h1>
              <p class="sub" data-i18n="ov.sub"></p>
            </div>
          </header>
          <div class="ov">
            <div class="posgrid" id="posgrid" role="group" data-i18n-aria="ov.position">
              <button type="button" data-position="top-left" data-i18n-aria="ov.topLeft"></button>
              <button type="button" data-position="top" data-i18n-aria="ov.top"></button>
              <button type="button" data-position="top-right" data-i18n-aria="ov.topRight"></button>
              <button type="button" data-position="left" data-i18n-aria="ov.left"></button>
              <button type="button" data-position="center" data-i18n-aria="ov.center"></button>
              <button type="button" data-position="right" data-i18n-aria="ov.right"></button>
              <button type="button" data-position="bottom-left" data-i18n-aria="ov.bottomLeft"></button>
              <button type="button" data-position="bottom" data-i18n-aria="ov.bottom"></button>
              <button type="button" data-position="bottom-right" data-i18n-aria="ov.bottomRight"></button>
            </div>
            <div class="ovprev"><div class="hud"><span class="st" data-i18n="hud.pasted"></span><span class="txt" id="ov-preview-text" data-i18n="ov.previewText"></span><span class="meta" data-i18n="ov.previewWords"></span></div></div>
          </div>
          <div class="rows">
            <div class="row">
              <span><span data-i18n="ov.showText"></span><small data-i18n="ov.showText.hint"></small></span>
              <button class="sw" type="button" role="switch" data-setting="overlayShowText" data-i18n-aria="ov.showText"></button>
            </div>
            <div class="row">
              <span data-i18n="ov.timer"></span>
              <button class="sw" type="button" role="switch" data-setting="overlayShowTimer" data-i18n-aria="ov.timer.aria"></button>
            </div>
          </div>
        </section>

        <!-- PERMISSÕES -->
        <section class="pane" data-pane="permissoes" hidden>
          <header class="ph">
            <div class="ph-text">
              <p class="label">Speech to Text</p>
              <h1 data-i18n="nav.permissions"></h1>
              <p class="sub" id="perm-sub"></p>
            </div>
            <button class="btn" id="perm-grant" type="button" data-i18n="ob.grant"></button>
          </header>
          <div class="rows" id="perm-rows"></div>
          <p class="note" data-i18n="perm.liveNote"></p>
        </section>

        <!-- SISTEMA -->
        <section class="pane" data-pane="sistema" hidden>
          <header class="ph">
            <div class="ph-text">
              <p class="label">Speech to Text</p>
              <h1 data-i18n="nav.system"></h1>
              <p class="sub" data-i18n="sys.sub"></p>
            </div>
          </header>
          <div class="rows">
            <div class="row">
              <span data-i18n="sys.autolaunch"></span>
              <button class="sw" type="button" role="switch" id="autolaunch" data-i18n-aria="sys.autolaunch"></button>
            </div>
            <div class="row">
              <span><span data-i18n="sys.history"></span><small data-i18n="sys.history.hint"></small></span>
              <span class="ctl">
                <span class="seg" data-setting="historyDays" data-type="number" role="group">
                  <button type="button" data-value="0" data-i18n="sys.history.off"></button>
                  <button type="button" data-value="7" data-i18n-days="7"></button>
                  <button type="button" data-value="30" data-i18n-days="30"></button>
                </span>
                <button class="lnk" id="clear-history" type="button" data-i18n="sys.clear"></button>
              </span>
            </div>
            <div class="row">
              <span><span data-i18n="sys.updates"></span><small id="update-status" data-i18n="sys.updates.unchecked"></small></span>
              <button class="lnk" id="check-updates" type="button" data-i18n="sys.updates.check"></button>
            </div>
            <div class="row">
              <span><span data-i18n="sys.diagnostics"></span><small data-i18n="sys.diagnostics.hint"></small></span>
              <span class="ctl">
                <button class="lnk" id="copy-diagnostics" type="button" data-i18n="sys.copy"></button>
                <button class="lnk" id="open-logs" type="button" data-i18n="sys.openFolder"></button>
              </span>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="bridge.js"></script>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
