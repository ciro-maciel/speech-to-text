<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay</title>
  <link href="fonts/fonts.css" rel="stylesheet">
  <style>
    /* Zen design system: one typeface, the gray ramp, radius 0, no shadow. red.6 is the
       only color and it only means "error". */
    :root {
      --g0: #FFFFFF; --g3: #E5E7EB; --g4: #9CA3AF; --g7: #374151; --g9: #11181C;
      --red: #E03131;
      --font: Montserrat, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; padding: 0 2px; font-family: var(--font); }
    body.edge-left { justify-content: flex-start; }
    body.edge-right { justify-content: flex-end; }

    .hud {
      background: var(--g9); color: var(--g0);
      height: 40px; min-width: 200px; max-width: 100%;
      display: flex; align-items: center; gap: 12px; padding: 0 14px;
      white-space: nowrap;
    }
    .hud[hidden] { display: none; }
    .st { font-size: 10px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; flex: none; }
    .meta { font-size: 12px; font-weight: 500; color: var(--g4); font-variant-numeric: tabular-nums; margin-left: auto; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .txt { font-size: 12px; font-weight: 500; color: var(--g3); overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
    .bars { display: flex; align-items: center; gap: 2px; height: 18px; flex: none; }
    .bars i { display: block; width: 3px; height: 2px; background: var(--g0); transition: height 80ms linear; }
    .track { position: relative; width: 64px; height: 2px; background: var(--g7); overflow: hidden; flex: none; }
    .track::after { content: ""; position: absolute; top: 0; left: -30%; width: 30%; height: 100%; background: var(--g0); animation: slide 0.9s ease-in-out infinite; }
    @keyframes slide { to { left: 100%; } }
    .muted .st { color: var(--g4); }
    .muted .bars i { background: var(--g7); }
    .err { background: var(--g0); color: var(--red); border: 1px solid var(--red); }
    .err .meta { color: var(--red); }
    .act {
      font-family: var(--font); font-size: 10px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase;
      color: var(--g9); background: var(--g0); border: 0; padding: 5px 8px; margin-left: auto; cursor: pointer; flex: none;
    }
    @media (prefers-reduced-motion: reduce) {
      .track::after { animation: none; left: 35%; }
      .bars i { transition: none; }
    }
  </style>
</head>
<body>
  <div id="hud" class="hud" role="status" aria-live="polite" hidden></div>

  <script src="bridge.js"></script>
  <script type="module">
    import { t, tn, applyI18n } from "./i18n.js";
    applyI18n();

    // States: listening | transcribing | refining | translating | pasted |
    // nothing | nopaste | error | cancelled. "Microphone silent" is derived
    // here: the renderer sends level -1 for chunks of pure digital silence.
    const BARS = 12;
    const MUTE_AFTER_MS = 1500;
    const LANG = { en: "EN", pt: "PT", es: "ES", fr: "FR", de: "DE", it: "IT", ja: "JA", ko: "KO", zh: "ZH", ru: "RU" };

    const hud = document.getElementById("hud");
    let state = null;
    let payload = {};
    let startedAt = 0;
    let clockTimer = null;
    let deadSince = 0;
    let barEls = [];

    const fmt = (ms) => {
      const s = Math.floor(ms / 1000);
      return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    };
    const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    function setEdge(anchor) {
      document.body.classList.toggle("edge-left", /left/.test(anchor || ""));
      document.body.classList.toggle("edge-right", /right/.test(anchor || ""));
    }

    function listeningMeta() {
      if (payload.locked) return t("hud.handsFree");
      return payload.showTimer === false ? "" : fmt(Date.now() - startedAt);
    }

    function renderListening(silent) {
      hud.className = "hud" + (silent ? " muted" : "");
      const label = silent ? t("hud.micSilent") : t(payload.mode === "translate" ? "hud.listeningTranslate" : "hud.listening");
      hud.innerHTML = `<span class="st">${label}</span><span class="bars" aria-hidden="true">${"<i></i>".repeat(BARS)}</span><span class="meta" id="clock">${listeningMeta()}</span>`;
      barEls = [...hud.querySelectorAll(".bars i")];
    }

    function render() {
      clearInterval(clockTimer);
      hud.hidden = false;
      const words = tn("hud.words", payload.words ?? 0);
      switch (state) {
        case "listening":
          deadSince = 0;
          renderListening(false);
          clockTimer = setInterval(() => {
            const clock = document.getElementById("clock");
            if (clock) clock.textContent = listeningMeta();
          }, 250);
          return;
        case "transcribing":
          hud.className = "hud";
          hud.innerHTML = `<span class="st">${t("hud.transcribing")}</span><span class="track" aria-hidden="true"></span><span class="meta">${t("hud.onDevice")}</span>`;
          break;
        case "refining":
          hud.className = "hud";
          hud.innerHTML = `<span class="st">${t("hud.refining")}</span><span class="track" aria-hidden="true"></span><span class="meta">${esc(payload.provider || t("hud.ai"))}</span>`;
          break;
        case "translating":
          hud.className = "hud";
          hud.innerHTML = `<span class="st">${t("hud.translating", { lang: LANG[payload.target] || "EN" })}</span><span class="track" aria-hidden="true"></span><span class="meta">OpenRouter</span>`;
          break;
        case "pasted":
          hud.className = "hud";
          hud.innerHTML = payload.showText === false
            ? `<span class="st">${t("hud.pasted")}</span><span class="meta">${words}</span>`
            : `<span class="st">${t("hud.pasted")}</span><span class="txt">${esc(payload.text)}</span><span class="meta">${words}</span>`;
          break;
        case "nothing":
          hud.className = "hud muted";
          hud.innerHTML = `<span class="st">${t("hud.nothingHeard")}</span><span class="meta">${t("hud.nothingPasted")}</span>`;
          break;
        case "cancelled":
          hud.className = "hud muted";
          hud.innerHTML = `<span class="st">${t("hud.cancelled")}</span><span class="meta">${t("hud.nothingPasted")}</span>`;
          break;
        case "nopaste":
          hud.className = "hud";
          hud.innerHTML = `<span class="st">${t("hud.copied", { keys: navigator.platform.includes("Mac") ? "⌘V" : "Ctrl+V" })}</span><button class="act" id="grant" type="button">${t("hud.allow")}</button>`;
          document.getElementById("grant").addEventListener("click", () => window.overlayApi.requestPermissions());
          break;
        case "error":
          hud.className = "hud err";
          hud.innerHTML = `<span class="st">${t("hud.error")}</span><span class="meta">${esc(payload.message || t("hud.somethingFailed"))}</span>`;
          break;
        default:
          hud.hidden = true;
      }
      if (state !== "listening") startedAt = 0;
    }

    function onLevel(level) {
      if (state !== "listening" || !barEls.length) return;
      // -1: a chunk of exact zeros (muted or disconnected device).
      if (level < 0) {
        if (!deadSince) deadSince = Date.now();
        if (Date.now() - deadSince > MUTE_AFTER_MS && !hud.classList.contains("muted")) renderListening(true);
        return;
      }
      if (deadSince) {
        deadSince = 0;
        if (hud.classList.contains("muted")) renderListening(false);
      }
      const lvl = Math.min(1, Math.max(0, level));
      barEls.forEach((el, i) => {
        const wobble = 0.55 + 0.45 * Math.abs(Math.sin(Date.now() / 120 + i * 0.9));
        el.style.height = `${Math.round(2 + lvl * wobble * 16)}px`;
      });
    }

    function init() {
      window.overlayApi.onState((p) => {
        const next = p?.state;
        if (next === "listening" && state !== "listening") startedAt = Date.now();
        payload = p || {};
        state = next;
        setEdge(payload.anchor);
        render();
      });
      window.overlayApi.onAudioLevel(onLevel);
    }

    (function waitForApi() {
      if (window.overlayApi) init();
      else setTimeout(waitForApi, 30);
    })();
  </script>
</body>
</html>
