name: Speech to Text — release

# Builds the .dmg, has Apple notarize it, and publishes it to
# blob.ciromaciel.click/tools/speech-to-text/ and to GitHub Releases. The page at
# ciromaciel.click/tools/speech-to-text and the README point to the fixed latest/ link, and
# the installed apps read latest.json, so a release updates the download button and every
# installed copy without a site deploy.
#
# WHEN IT PUBLISHES: when the version in package.json is greater than the published one.
# Bumping it and pushing to main is the release. A push without a new version only runs
# "plan".
#
# SIGNING: the Developer ID Application certificate of Ciro Cesar Maciel (secret
# MACOS_CERTIFICATE), imported into a throwaway keychain. scripts/release/build-mac.sh has
# Tauri sign the app and the whisper.cpp and Parakeet sidecars with it and the hardened runtime, and
# notarize the app; then it signs, notarizes and staples the .dmg (App Store Connect API
# key: NOTARY_KEY, NOTARY_KEY_ID, NOTARY_ISSUER_ID). The fixed identity keeps Microphone and
# Accessibility granted from one version to the next.
#
# UPDATES: the update archive is signed with the Tauri updater key (TAURI_SIGNING_PRIVATE_KEY,
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD); the app only installs what that key signed.
#
# The secrets live in the "release" environment, which only main can use. Pull requests
# never see them.

on:
    push:
        branches: [main]
        paths:
            - 'package.json'
            - 'bun.lock'
            - 'src/**'
            - 'src-tauri/**'
            - 'scripts/**'
            - 'entitlements.mac.plist'
            - '.github/workflows/release.yml'
    workflow_dispatch:

concurrency:
    group: release
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    plan:
        runs-on: ubuntu-latest
        timeout-minutes: 3
        outputs:
            version: ${{ steps.plan.outputs.version }}
            go: ${{ steps.plan.outputs.go }}
        steps:
            - uses: actions/checkout@v4
              with:
                  sparse-checkout: package.json
                  sparse-checkout-cone-mode: false
            - name: Compare with blob.ciromaciel.click
              id: plan
              run: |
                  VERSION="$(sed -n 's/^ *"version": *"\([^"]*\)".*/\1/p' package.json | head -1)"
                  PUBLISHED="$(curl -sf https://blob.ciromaciel.click/tools/speech-to-text/latest.json | sed -n 's/^ *"version": *"\([^"]*\)".*/\1/p' | head -1 || true)"
                  GO=false
                  if [ -z "$PUBLISHED" ]; then GO=true
                  elif [ "$VERSION" != "$PUBLISHED" ] && [ "$(printf '%s\n%s\n' "$PUBLISHED" "$VERSION" | sort -V | tail -1)" = "$VERSION" ]; then GO=true
                  fi
                  echo "speech-to-text: $VERSION here, ${PUBLISHED:-none} published → $([ $GO = true ] && echo build || echo skip)"
                  echo "version=$VERSION" >>"$GITHUB_OUTPUT"
                  echo "go=$GO" >>"$GITHUB_OUTPUT"

    release:
        needs: plan
        if: needs.plan.outputs.go == 'true'
        name: Speech to Text ${{ needs.plan.outputs.version }}
        runs-on: macos-15
        timeout-minutes: 60
        environment: release
        permissions:
            contents: write
        env:
            VERSION: ${{ needs.plan.outputs.version }}
            CARGO_TERM_COLOR: always
            CARGO_INCREMENTAL: 0
        steps:
            - uses: actions/checkout@v4

            - name: Signing identity
              env:
                  CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
                  PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
              run: |
                  KC="$RUNNER_TEMP/signing.keychain-db"
                  KP="$(openssl rand -hex 16)"
                  echo "$CERTIFICATE" | base64 --decode >"$RUNNER_TEMP/signing.p12"
                  security create-keychain -p "$KP" "$KC"
                  security set-keychain-settings -lut 21600 "$KC"
                  security unlock-keychain -p "$KP" "$KC"
                  security import "$RUNNER_TEMP/signing.p12" -k "$KC" -P "$PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
                  security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC" >/dev/null
                  KEYCHAINS=("$KC")
                  while IFS= read -r line; do KEYCHAINS+=("$(echo "$line" | xargs)"); done < <(security list-keychains -d user)
                  security list-keychains -d user -s "${KEYCHAINS[@]}"
                  # The Developer ID G2 intermediate, in case the runner lacks it.
                  curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
                  security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KC" || true
                  security find-identity -v -p codesigning "$KC" | grep -q "Developer ID Application" ||
                      { echo "no Developer ID Application identity in MACOS_CERTIFICATE"; exit 1; }
                  rm -f "$RUNNER_TEMP/signing.p12"

            - uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri -> target

            - uses: oven-sh/setup-bun@v2

            # whisper.cpp is built from source once per version (scripts/whisper.sh).
            - uses: actions/cache@v4
              with:
                  path: .whisper
                  key: whisper-${{ hashFiles('scripts/whisper.sh') }}-${{ runner.os }}-${{ runner.arch }}

            # The Parakeet sidecar's SwiftPM build, FluidAudio included (scripts/parakeet.sh).
            - uses: actions/cache@v4
              with:
                  path: .parakeet
                  key: parakeet-${{ hashFiles('parakeet/Package.swift', 'parakeet/Package.resolved') }}-${{ runner.os }}-${{ runner.arch }}

            - name: Build, sign and notarize
              env:
                  NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
                  APPLE_API_KEY: ${{ secrets.NOTARY_KEY_ID }}
                  APPLE_API_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              run: |
                  export APPLE_API_KEY_PATH="$RUNNER_TEMP/notary.p8"
                  printf '%s\n' "$NOTARY_KEY" >"$APPLE_API_KEY_PATH"
                  bash scripts/release/build-mac.sh "$RUNNER_TEMP/release"
                  rm -f "$APPLE_API_KEY_PATH"

            - name: Publish to blob.ciromaciel.click
              run: bash scripts/release/publish-mac.sh "$RUNNER_TEMP/release"
              env:
                  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

            - name: Publish to GitHub Releases
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  cat >"$RUNNER_TEMP/notes.md" <<NOTES
                  Install with one line: \`curl -fsSL https://blob.ciromaciel.click/tools/speech-to-text/install.sh | bash\`.

                  Or download the .dmg and drag Speech to Text to Applications: signed with Developer ID and notarized by Apple. Apple Silicon, macOS 11+. Installed copies update themselves.

                  Made by [Ciro Cesar Maciel](https://ciromaciel.click/?ref=oss-speech-to-text-release). [Follow @ciro-maciel](https://github.com/ciro-maciel) for the next open-source tools.
                  NOTES
                  sed -i '' 's/^ *//' "$RUNNER_TEMP/notes.md"
                  gh release create "v$VERSION" "$RUNNER_TEMP/release/Speech-to-Text-$VERSION-macos.dmg" \
                      --title "Speech to Text by Ciro Cesar Maciel $VERSION" --target "$GITHUB_SHA" --notes-file "$RUNNER_TEMP/notes.md"
